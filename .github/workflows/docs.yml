name: Documentation

# Builds the Sphinx documentation on every push and pull request, and deploys
# it to GitHub Pages on pushes to master. This replaces the ``doc_test_build``
# and ``pages`` jobs of the old GitLab CI pipeline.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, without cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinxcontrib-bibtex sphinx_rtd_theme sphinx-autoapi
          pip install -r requirements.txt
      - name: Build documentation
        run: sphinx-build -c sphinx -b html sphinx public
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    # Only deploy from master, never from pull requests.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
