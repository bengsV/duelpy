name: Publish to PyPI

# Migrated from the GitLab CI ``pypi`` job. Builds the distribution and uploads
# it to PyPI when a version tag (``vX.Y.Z``) is pushed.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Add the PyPI API token as a repository secret named
          # ``PYPI_API_TOKEN`` (the same token previously used for the GitLab
          # ``TWINE_PASSWORD`` variable). Alternatively, switch to PyPI Trusted
          # Publishing: drop this ``with`` block, add ``permissions: id-token:
          # write`` to this job, and register the publisher on PyPI.
          password: ${{ secrets.PYPI_API_TOKEN }}
