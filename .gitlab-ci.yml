# Use the python image to speed up the setup.
# https://hub.docker.com/r/library/python/tags/
image: python:latest

stages:
  - test
  - deploy

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - apt-get update -qy
  - apt-get install -y python3-dev python3-pip
  - python3 -V  # Print out python version for debugging
  - pip3 install virtualenv
  - virtualenv venv
  - source venv/bin/activate

lint:
  stage: test
  script:
  - pip install pre-commit
  - pre-commit run --all-files

pytest:
  stage: test
  script:
  - pip install pytest
  - pip install -r requirements.txt
  - pytest

test:
  stage: test
  script:
  - pip install --upgrade sphinx
  - pip install -r requirements.txt
  - sphinx-apidoc -o _doc duelpy
  - cp sphinx/index.rst _doc/index.rst
  - sphinx-build -c sphinx -b html _doc doc_test
  artifacts:
    expose_as: 'docs'
    paths:
      - doc_test
    expire_in: 1 week
  only:
  - branches
  except:
  - master

pages:
  stage: deploy
  script:
  - pip install --upgrade sphinx
  - pip install -r requirements.txt
  - sphinx-apidoc -o _doc duelpy
  - cp sphinx/index.rst _doc/index.rst
  - sphinx-build -c sphinx -b html _doc public
  artifacts:
    paths:
    - public
  only:
  - master

pypi:
  stage: deploy
  script:
  - pip install twine setuptools wheel
  - python3 setup.py sdist bdist_wheel
  # The API token is provided in the TWINE_PASSWORD environment variable configured in the CI
  - twine upload --user __token__ dist/*
  only:
    # tags of type v1.2.3
    - /^v(\d+\.)?(\d+\.)?(\d+)$/
  except:
    - branches
