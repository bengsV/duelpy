# Use the python image to speed up the setup.
# https://hub.docker.com/r/library/python/tags/
image: python:latest

# Configure pipeline to run on merged results.
# https://docs.gitlab.com/ee/ci/merge_request_pipelines/pipelines_for_merged_results
#
# This would avoid a pipeline failure after merge.
include:
  - template: 'Workflows/MergeRequest-Pipelines.gitlab-ci.yml'

stages:
  - test
  - deploy

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - apt-get update -qy
  # libopenblas-dev is necessary for scipy, and scipy is pulled in by our
  # seaborn dependency
  - apt-get install -y python3-dev python3-pip libopenblas-dev
  - python3 -V  # Print out python version for debugging
  - pip3 install virtualenv
  - virtualenv venv
  - source venv/bin/activate

lint:
  stage: test
  script:
  - pip install pre-commit
  - pre-commit run --all-files

pytest:
  stage: test
  script:
  - pip install pytest pytest-cov
  - pip install -r requirements.txt
  - pytest --cov=duelpy --cov-report=xml:coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

.sphinx_build: &sphinx_build
  - pip install --upgrade sphinx sphinxcontrib-bibtex sphinx_rtd_theme sphinx-autoapi
  - pip install -r requirements.txt

doc_test_build:
  stage: test
  script:
  - *sphinx_build
  - sphinx-build -c sphinx -b html sphinx doc_test
  artifacts:
    expose_as: 'docs'
    paths:
      - doc_test
    expire_in: 1 week
  except:
  - master

pages:
  stage: deploy
  script:
  - *sphinx_build
  - sphinx-build -c sphinx -b html sphinx public
  artifacts:
    paths:
    - public
  only:
  - master

pytest-py38:
  stage: test
  image: python:3.8
  script:
  - pip install pytest pytest-cov
  - pip install -r requirements.txt
  - pytest --cov=duelpy --cov-report=xml:coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

pypi:
  stage: deploy
  script:
  - pip install twine build
  - python3 -m build
  # The API token is provided in the TWINE_PASSWORD environment variable configured in the CI
  - twine upload --user __token__ dist/*
  only:
    # tags of type v1.2.3
    - /^v(\d+\.)?(\d+\.)?(\d+)$/
  except:
    - branches
